<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schere, Stein, Papier</title>
    <script src="assets/js/main.js" defer></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="rahmen-container">
        <div class="oberhalbrahmen">
            <div class="container-punkte">
                <div class="rst-btn">
                    <button class="reset-btn">Reset</button>
                </div>
                <div class="punkte">
                    <div class="goku-punkte">
                        0
                    </div>
                    <div>:</div>
                    <div class="vegeta-punkte">
                        0
                    </div>
                </div>
                <div class="container-text">
                    <div class="gokutxt">..............</div>
                    <div class="result">← ....... →</div>
                    <div class="vegetatxt">..............</div>
                </div>
                <div class="symbole">
                    <div class="schere">
                        <img src="assets/images/Schere2.png" alt="schere" class="schere-btn">
                    </div>
                    <div class="stein">
                        <img src="assets/images/Stein2.png" alt="stein" class="stein-btn">
                    </div>
                    <div class="papier">
                        <img src="assets/images/Papier2.png" alt="papier" class="papier-btn">
                    </div>
                </div>
            </div>
        </div>
        <div class="rahmen">
            <div class="goku">
                <img src="assets/images/SonGoku2.png" alt="Goku">
            </div>
            
            <div class="vegeta">
                <img src="assets/images/Vegeta2.png" alt="Vegeta">
            </div>
        </div>
    </div>
</body>
</html>
